# Unit-test agent for pull requests.
#
#   plan     trusted triage of the diff (base-branch scripts, no PR code executed, no secrets)
#   agent    Claude Code `unit-test-engineer` writes and runs tests (model key only, read-only token,
#            agent configuration restored from the base branch, policy enforced by hook + settings)
#   verify   independent re-run on a fresh machine without secrets: guard, typecheck, suites,
#            stability, coverage; produces the only patch that may be proposed
#   publish  renders the report from artifacts (no model, no PR code) and upserts one PR comment
#
# Nothing is committed here. A maintainer applies the verified patch on demand
# (label `unit-test-agent:apply`, separate workflow).

name: Unit-test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: unit-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: UTC
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  plan:
    name: Plan
    # Same-repository, non-draft, human-authored PRs only. Fork PRs get no secrets by design.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.type != 'Bot'
      && !contains(github.event.pull_request.labels.*.name, 'unit-test-agent:skip')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      installed: ${{ steps.installed.outputs.installed }}
      run_agent: ${{ steps.plan.outputs.run_agent }}
    steps:
      - name: Check out base (trusted tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out PR head (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - id: installed
        name: Require the agent on the base branch
        run: |
          if [[ -f trusted/.claude/agents/unit-test-engineer.md && -f trusted/scripts/agent/plan.ts ]]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "The unit-test agent is not installed on the base branch; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.installed.outputs.installed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - id: plan
        if: steps.installed.outputs.installed == 'true'
        name: Build the test plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plan"
          node trusted/scripts/agent/plan.ts --repo pr --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP/plan/plan.json"
          echo "run_agent=$(jq -r .run_agent "$RUNNER_TEMP/plan/plan.json")" >> "$GITHUB_OUTPUT"
          jq '{run_agent, skip_reason, routing, targets: [.targets[] | {source, owner_test, owner_test_exists, changed_line_count}], flags}' "$RUNNER_TEMP/plan/plan.json"
      - if: steps.installed.outputs.installed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-plan
          path: ${{ runner.temp }}/plan/plan.json
          retention-days: 3

  agent:
    name: Agent
    needs: plan
    if: needs.plan.outputs.run_agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: unit-test-agent
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Check out base (trusted tooling and agent configuration)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Restore agent configuration from the base branch
        # A PR must not be able to change the agent that reviews it: remove every
        # agent instruction/config file the PR could add (at any depth) and use base's.
        run: |
          set -euo pipefail
          find pr -path pr/.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md -o -name .claude -o -name .mcp.json -o -name .claude.json \) -print0 \
            | xargs -0 --no-run-if-empty rm -rf
          cp -R trusted/.claude pr/.claude
          if [[ -f trusted/CLAUDE.md ]]; then cp trusted/CLAUDE.md pr/CLAUDE.md; fi
          git -C pr add -A
          git -C pr -c user.name=unit-test-agent -c user.email=unit-test-agent@localhost \
            commit --quiet --allow-empty --no-verify -m "ci: use the base branch agent configuration"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - name: Install the pinned Claude Code CLI (trusted lockfile)
        working-directory: trusted/.github/agent-runtime
        run: |
          npm ci --ignore-scripts
          # Links the platform binary from the integrity-checked optional dependency (no network).
          node node_modules/@anthropic-ai/claude-code/install.cjs
          node_modules/.bin/claude --version
      - name: Install PR dependencies (lifecycle scripts disabled)
        run: |
          set -euo pipefail
          (cd pr/backend && npm ci --ignore-scripts && npm run db:generate)
          (cd pr/frontend && npm ci --ignore-scripts)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-agent-plan
          path: ${{ runner.temp }}/plan
      - name: Enable the subprocess sandbox (bubblewrap + socat)
        # With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 Claude Code runs every agent subprocess (including
        # the PR's tests) in bubblewrap: no credentials in its environment and no view of the agent
        # process; socat carries the sandbox's network proxy (no domains are allowed). Ubuntu 24.04
        # blocks unprivileged user namespaces via AppArmor, so bwrap gets a narrow profile.
        # Verified here, before the model key is used.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/bwrap > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent true
          socat -V > /dev/null
          echo "bubblewrap $(bwrap --version) works with an isolated PID namespace; socat at $(command -v socat)"
      - name: Run the unit-test agent
        env:
          # The only secret in the workflow, scoped to this step. No GitHub token is passed on.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          node trusted/scripts/agent/run-agent.ts \
            --repo pr \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --out "$RUNNER_TEMP/agent" \
            --claude "$GITHUB_WORKSPACE/trusted/.github/agent-runtime/node_modules/.bin/claude" \
            --escalate
          jq . "$RUNNER_TEMP/agent/metrics.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-output
          path: |
            ${{ runner.temp }}/agent/agent.patch
            ${{ runner.temp }}/agent/agent-result.json
            ${{ runner.temp }}/agent/guard.json
            ${{ runner.temp }}/agent/metrics.json
          retention-days: 3
          if-no-files-found: error

  verify:
    name: Verify
    needs: [plan, agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Check out base (trusted tooling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - name: Install PR dependencies (lifecycle scripts disabled)
        run: |
          set -euo pipefail
          (cd pr/backend && npm ci --ignore-scripts && npm run db:generate)
          (cd pr/frontend && npm ci --ignore-scripts)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-agent-{plan,output}
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Verify the agent patch
        run: |
          node trusted/scripts/agent/verify.ts \
            --repo pr \
            --plan "$RUNNER_TEMP/in/plan.json" \
            --patch "$RUNNER_TEMP/in/agent.patch" \
            --out "$RUNNER_TEMP/verify"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-verdict
          path: ${{ runner.temp }}/verify/verdict.json
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-final-patch
          path: ${{ runner.temp }}/verify/final.patch
          retention-days: 7

  publish:
    name: Publish report
    needs: [plan, agent, verify]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.installed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # create or update the single report comment; nothing else is written
    steps:
      - name: Check out base (trusted renderer only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .claude/lib
            .claude/schemas
            scripts/agent
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-test-agent-*
          path: ${{ runner.temp }}/report
          merge-multiple: true
      - name: Render report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node trusted/scripts/agent/render-report.ts --dir "$RUNNER_TEMP/report" --run-url "$RUN_URL" --out "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Skip if the PR moved on: a newer run will report on the new head.
          current="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "PR head moved from $HEAD_SHA to $current; not publishing a stale report."
            exit 0
          fi
          marker='<!-- unit-test-agent:report -->'
          comment_id="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          body="$(jq -Rs '{body: .}' "$RUNNER_TEMP/report.md")"
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" --input - <<< "$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - <<< "$body" > /dev/null
          fi
