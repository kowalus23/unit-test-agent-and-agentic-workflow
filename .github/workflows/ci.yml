# Deterministic quality gates for every pull request and for main.
#
# The only required status check is `ci-ok`. Path filtering happens at job
# level (a skipped job counts as success) because workflow-level `paths:`
# would leave a required check pending forever.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # PRs cancel superseded runs; every push to main gets its own run.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tooling: ${{ steps.filter.outputs.tooling }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its first parent (the base) are enough to diff.
          fetch-depth: 2
      - id: filter
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf 'backend=true\nfrontend=true\ntooling=true\nworkflows=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move; quotePath=false keeps non-ASCII paths matchable.
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          printf 'Changed files:\n%s\n' "$changed"
          shared='^(\.github/workflows/ci\.yml|\.nvmrc|scripts/ci/.*)$'
          has() { if grep -qE "$1" <<< "$changed"; then echo true; else echo false; fi; }
          {
            echo "backend=$(has "^backend/|$shared")"
            echo "frontend=$(has "^frontend/|$shared")"
            echo "tooling=$(has "^scripts/|$shared")"
            echo "workflows=$(has '^\.github/|^scripts/[^/]+\.sh$')"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend (Node ${{ matrix.node || 'from .nvmrc' }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # engines floor (>=22.12) and the primary version pinned in .nvmrc.
        include:
          - node: "22.12.0"
            primary: false
          - node-file: .nvmrc
            primary: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node-file }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Coverage summary
        if: matrix.primary && !cancelled()
        run: node ../scripts/ci/coverage-summary.ts Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.primary && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node ${{ matrix.node || 'from .nvmrc' }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.12.0"
            primary: false
          - node-file: .nvmrc
            primary: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node-file }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts
      - name: Check formatting
        if: matrix.primary
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build application
        run: npx vite build
      - name: Build Storybook
        if: matrix.primary
        run: npm run build-storybook -- --quiet
      - name: Coverage summary
        if: matrix.primary && !cancelled()
        run: node ../scripts/ci/coverage-summary.ts Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: matrix.primary && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  tooling:
    name: Tooling (scripts/)
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install type-checking dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  workflow-lint:
    name: Workflow lint (actionlint, zizmor, shellcheck)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-pinned)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Install zizmor (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes \
            -r .github/tools/zizmor-requirements.txt
      - name: Run zizmor
        env:
          # Online audits (impostor-commit, known-vulnerable-actions, ref-confusion)
          # verify that every pinned SHA really belongs to the named action.
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .github/'
      - name: Run shellcheck on repository scripts
        run: shellcheck scripts/*.sh

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, frontend, tooling, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          failed="$(jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length' <<< "$NEEDS")"
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::${failed} required job(s) did not succeed"
            exit 1
          fi
